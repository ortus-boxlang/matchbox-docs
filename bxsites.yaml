name: MatchBox
description: The portable BoxLang runtime for native, web, serverless, and embedded environments.
baseURL: https://matchbox.boxlang.io/
source: docs
repo:
  url: https://github.com/ortus-boxlang/matchbox-docs
  editUri: https://github.com/ortus-boxlang/matchbox-docs/edit/main/docs/
search: true
mcp: true
mermaid: true
footer: true
theme:
  name: bootstrap
  logo: assets/matchbox.svg
  favicon: assets/matchbox.svg
  options:
    navCollapsible: true
    navExpandAll: false
    tocPosition: sticky
    accentColor: '#00FF78'
    accentColorDark: '#00DBFF'
markdown:
  enableFootnotes: true
  enableDefinitionLists: true
extraCss:
  - assets/brand.css
pageActions: true
lastUpdated: true
math: true
openapi: true
imageGallery: true
generateOgImages: true
social:
  - url: https://github.com/ortus-boxlang/matchbox
    icon: github
    label: MatchBox on GitHub
  - url: https://github.com/ortus-boxlang/BoxLang
    icon: github
    label: BoxLang on GitHub
  - url: https://x.com/TryBoxLang
    icon: twitter
    label: X (Twitter)
  - url: https://www.youtube.com/@OrtusSolutions
    icon: youtube
    label: YouTube
  - url: https://www.linkedin.com/company/tryboxlang
    icon: linkedin
    label: LinkedIn
  - url: https://bsky.app/profile/boxlang.bsky.social
    icon: bluesky
    label: Bluesky
  - url: https://www.ortussolutions.com/community/slack
    icon: slack
    label: Slack Community
  - url: https://www.patreon.com/ortussolutions
    icon: patreon
    label: Patreon